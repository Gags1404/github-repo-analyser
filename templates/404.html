{% extends "base.html" %}

{% block title %}Page Not Found - GitHub Repository Analyzer{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <div class="card shadow">
            <div class="card-body py-5">
                <h1 class="display-1 text-danger mb-4">404</h1>
                <h2 class="mb-4">Page Not Found</h2>
                <p class="lead mb-4">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
                <img src="{{ url_for('static', filename='images/octocat_confused.png') }}" alt="Confused Octocat" class="img-fluid mb-4" style="max-height: 200px;">
                <div>
                    <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
                        <i class="fas fa-home me-2"></i>Return to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
